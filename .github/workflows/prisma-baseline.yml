name: Prisma — criar migration baseline

# PASSO 1 de 2 (uma única vez). Actions -> "Prisma — criar migration baseline" -> Run workflow.
# Gera prisma/migrations/0_baseline a partir do schema.prisma ACTUAL (sem tocar em nenhuma base
# de dados) e faz commit. Depois corre o passo 2 ("marcar baseline como aplicada").
# Cria DUAS migrations: 0_baseline (o que a produção já tem) e 1_evolucao_schema_v2 (tabelas novas).
# Nota: os índices de prisma/manual-sql/*.sql NÃO fazem parte do schema.prisma; como a base de dados
# de produção já os tem, o baseline não os recria (só é marcado como aplicado, nunca executado em produção).
on: workflow_dispatch

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Recusar se já existirem migrations
        run: |
          if [ -d prisma/migrations ] && [ -n "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            echo "prisma/migrations já existe — nada a fazer."
            exit 1
          fi

      # 0_baseline = o schema que a produção JÁ TEM (prisma/schema.baseline.prisma, cópia do
      # schema antes da Fase E). É só marcado como "aplicado" — nunca executado em produção.
      - name: Gerar 0_baseline (schema vazio -> schema.baseline.prisma)
        run: |
          mkdir -p prisma/migrations/0_baseline
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.baseline.prisma --script > prisma/migrations/0_baseline/migration.sql
          printf '# Please do not edit this file manually\n# It should be added in your version-control system (i.e. Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          wc -l prisma/migrations/0_baseline/migration.sql

      # 1_evolucao_schema_v2 = só as diferenças entre o baseline e o schema.prisma actual: 3 TABELAS NOVAS
      # (PaymentWebhookEvent, ProductStat, NotificationPreference). Nenhuma coluna nova em tabelas existentes.
      # Este SIM é executado pelo `migrate deploy` no arranque.
      - name: Gerar 1_evolucao_schema_v2 (baseline -> schema.prisma actual)
        run: |
          mkdir -p prisma/migrations/1_evolucao_schema_v2
          npx prisma migrate diff --from-schema-datamodel prisma/schema.baseline.prisma --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/1_evolucao_schema_v2/migration.sql
          cat prisma/migrations/1_evolucao_schema_v2/migration.sql
          # Segurança: a migration só pode CRIAR coisas — nunca apagar/alterar dados.
          if grep -Eiq 'DROP |TRUNCATE|DELETE FROM|ALTER TABLE .* DROP' prisma/migrations/1_evolucao_schema_v2/migration.sql; then
            echo "ERRO: a migration contém operações destrutivas. Abortado." >&2
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "chore(prisma): migration baseline 0_baseline"
          git push
