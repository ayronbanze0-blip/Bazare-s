name: Migrar BD Neon -> Supabase

on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump da Neon
        run: |
          pg_dump "${{ secrets.NEON_DATABASE_URL }}" -Fc --no-owner --no-acl -f neon_dump.dump

      - name: Restaurar na Supabase
        run: |
          pg_restore --no-owner --no-privileges --clean --if-exists -d "${{ secrets.SUPABASE_DATABASE_URL }}" neon_dump.dump

      - name: Verificar tabelas na Supabase
        run: psql "${{ secrets.SUPABASE_DATABASE_URL }}" -c "\dt"
