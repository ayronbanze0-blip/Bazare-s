name: Migrar BD Neon -> Supabase

on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar postgresql-client 18
        run: |
          sudo apt-get install -y wget gnupg
          sudo mkdir -p /etc/apt/keyrings
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump da Neon
        run: |
          /usr/lib/postgresql/18/bin/pg_dump "${{ secrets.NEON_DATABASE_URL }}" -Fc --no-owner --no-acl -f neon_dump.dump

      - name: Restaurar na Supabase
        run: |
          /usr/lib/postgresql/18/bin/pg_restore --no-owner --no-privileges --clean --if-exists -d "${{ secrets.SUPABASE_DATABASE_URL }}" neon_dump.dump

      - name: Verificar tabelas na Supabase
        run: /usr/lib/postgresql/18/bin/psql "${{ secrets.SUPABASE_DATABASE_URL }}" -c "\dt"
