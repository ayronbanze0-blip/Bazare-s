name: Prisma — sincronizar schema (criar e aplicar migração)

# Automático, sem correr nada à mão: sempre que fazes push de uma alteração a prisma/schema.prisma
# (ou corres este workflow manualmente), ele:
#   1. compara prisma/migrations com o schema numa base temporária e GERA a migração (se houver diferença);
#   2. faz commit da migração em prisma/migrations/<data>_<nome>/;
#   3. APLICA as migrações pendentes na base de produção (prisma migrate deploy);
#   4. CONFERE que todas as tabelas do schema existem mesmo na base (avisa se faltar alguma).
# Não precisas de escrever nada no fim do schema nem de dar nome: o nome sai da mensagem do commit.
#
# Secret para aplicar: PRODUCTION_DATABASE_URL (Supabase "Session pooler", porta 5432 — IPv4; a ligação directa db.xxx.supabase.co é só IPv6 e não funciona nos runners do GitHub). Sem ele, só gera a migração.
# Operações destrutivas (DROP/TRUNCATE/DELETE) são recusadas — exigem revisão e backup.
on:
  push:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
  workflow_dispatch:
    inputs:
      nome:
        description: 'Nome curto (opcional; a-z, 0-9, _). Vazio = automático'
        required: false
        default: ''

concurrency:
  group: prisma-schema-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHADOW_URL: postgresql://postgres:shadow@localhost:5432/shadow
      INPUT_NOME: ${{ github.event.inputs.nome }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      PROD_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - name: Escolher o nome da migração
        run: |
          nome="$INPUT_NOME"
          if [ -z "$nome" ]; then
            nome=$(printf '%s' "$COMMIT_MSG" | head -n1 | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null \
              | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g' | cut -c1-40 | sed -E 's/_+$//')
          fi
          if ! printf '%s' "$nome" | grep -Eq '^[a-z0-9_]{3,50}$'; then nome="schema_update"; fi
          echo "Nome da migração: $nome"
          echo "MIG_NOME=$nome" >> "$GITHUB_ENV"

      - name: 1) Gerar SQL (migrations existentes -> schema.prisma)
        run: |
          test -d prisma/migrations || { echo "Sem prisma/migrations — corre primeiro o workflow de baseline." >&2; exit 1; }
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_URL" --script > /tmp/migration.sql
          cat /tmp/migration.sql
          if ! grep -Eq '[A-Za-z]' <(grep -v '^--' /tmp/migration.sql); then
            echo "Sem diferenças entre migrations e schema — nada a gerar."
            echo "EMPTY=1" >> "$GITHUB_ENV"; exit 0
          fi
          if grep -Eiq 'DROP |TRUNCATE|DELETE FROM|ALTER TABLE .* DROP' /tmp/migration.sql; then
            echo "ERRO: a migração tem operações destrutivas (DROP/TRUNCATE/DELETE) — requer revisão manual." >&2
            exit 1
          fi

      - name: 2) Commit da migração
        if: env.EMPTY != '1'
        run: |
          dir="prisma/migrations/$(date -u +%Y%m%d%H%M%S)_${MIG_NOME}"
          mkdir -p "$dir"
          cp /tmp/migration.sql "$dir/migration.sql"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "chore(prisma): migration ${MIG_NOME} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Migração criada em $dir"

      - name: 3) Aplicar migrações pendentes na produção
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::warning::Sem secret PRODUCTION_DATABASE_URL — migração gerada mas NÃO aplicada (o deploy do Render aplica-a)."
            exit 0
          fi
          case "$PROD_URL" in
            *:6543*|*pgbouncer=true*) echo "ERRO: URL do pooler (6543/pgbouncer). Usa o Session pooler da Supabase (porta 5432)." >&2; exit 1;;
          esac
          export DATABASE_URL="$PROD_URL"
          npx prisma migrate status || true
          npx prisma migrate deploy
          npx prisma migrate status

      - name: 3b) Criar o que falta na base (sincronização aditiva, nunca apaga)
        run: |
          [ -n "$PROD_URL" ] || exit 0
          DATABASE_URL="$PROD_URL" node scripts/sync-schema-additive.js

      - name: 4) Conferir que as tabelas do schema existem
        run: DATABASE_URL="$PROD_URL" node scripts/check-schema-tables.js
